[project]
name = "vigia"
version = "0.1.0"
description = "Ingestion, analysis and short-term forecasting for Peruvian public health surveillance data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "charset-normalizer>=3.3",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
