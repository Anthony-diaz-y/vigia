name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript, lint and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: vigia
          POSTGRES_DB: vigia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigia -d vigia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIGIA_TEST_DATABASE_URL: postgresql://vigia:vigia@localhost:5432/vigia_test
      VIGIA_AUTH_SECRET: ci-secret-for-signing-test-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @vigia/api test:db
